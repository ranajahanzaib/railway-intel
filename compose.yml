services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      RAILWAY_DATA_DIR: /data/processed
    volumes:
      - railway-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  ingest:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ["ingestion"]
    volumes:
      - railway-data:/data
    entrypoint: ["python", "-m", "railway_intel.cli"]
    command: ["download", "--month", "${MONTH:-2024-07}", "--output", "/data"]

volumes:
  railway-data:
