name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra warehouse
      - run: cp profiles.example.yml profiles.yml
      - run: uv run --extra dev --extra warehouse ruff check railway_intel tests
      - run: uv run --extra dev --extra warehouse pytest
      - run: uv run --extra dev --extra warehouse dbt parse --project-dir . --profiles-dir . --profile railway_intel
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
